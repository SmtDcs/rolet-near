[package]
name = "rolet-near"
version = "0.1.0"
edition = "2021"

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "=5.30.2"
near-contract-standards = "=5.30.2"
# borsh derive makroları üretilen kodda `borsh` adını doğrudan aradığı için
# (proc_macro_crate manifestoda bakar) doğrudan bağımlılık zorunlu;
# sürüm near-sdk 5.30.2'nin kilitlediği borsh ile aynı.
borsh = "=1.8.1"


[dev-dependencies]
near-sdk = { version = "=5.30.2", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
