packages:
  - 'apps/*'
  - 'packages/*'
overrides:
  '@near-js/accounts': '2.5.1'
  '@near-js/crypto': '2.5.1'
  '@near-js/keystores': '2.5.1'
  '@near-js/keystores-browser': '2.5.1'
  '@near-js/keystores-node': '2.5.1'
  '@near-js/providers': '2.5.1'
  '@near-js/signers': '2.5.1'
  '@near-js/tokens': '2.5.1'
  '@near-js/transactions': '2.5.1'
  '@near-js/types': '2.5.1'
  '@near-js/utils': '2.5.1'
allowBuilds:
  '@stellar/stellar-sdk': true
  blake-hash: true
  bufferutil: true
  esbuild: true
  protobufjs: true
  sharp: true
  tiny-secp256k1: true
  unrs-resolver: true
  usb: true
  utf-8-validate: true
